[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bazaszachowa-tools"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.15,<5",
    "chess>=1.11,<2",
    "mysql-connector-python>=26.7,<27",
    "pymongo>=4.17,<5",
    "python-dateutil>=2.9,<3",
    "requests>=2.34,<3",
    "typing_extensions>=4.16,<5",
    "Unidecode>=1.4,<2",
    "zstandard>=0.25,<1",
]

[project.optional-dependencies]
dev = ["mypy>=2.3,<3", "mypy_extensions>=1.1,<2", "ruff>=0.16,<1"]

curl_cffi = ["curl_cffi>=0.16,<1"]
analysis = [
    "matplotlib",
    "numpy",
    "keras",
    "tensorflow",
    "tensorflow[and-cuda]>=2.21.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".idea",
    ".venv",
    "__pycache__",
    "repeatable_tasks/downloaded_zips",
    "repeatable_tasks/pgns",
    "chess_scrappers",
]

[tool.setuptools]
py-modules = []


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify\
    "RET", # flake8-return
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

ignore_missing_imports = true

exclude = ['^chess_scrappers/', '^python/chess_scrappers/']
